<!DOCTYPE html>
<html>

<head>
    <title>Documentation API</title>
</head>

<body>
    <h1>Documentation NJI Auto Pro API</h1>
    <div id="token-input">
        <input type="text" id="jwt-token" placeholder="Collez votre token JWT ici" style="width: 80%">
        <button onclick="fetchDocumentation()">Accéder à la documentation</button>
    </div>
    <div id="documentation-content" style="margin-top: 20px;"></div>

    <script>
        async function fetchDocumentation() {
            const token = document.getElementById('jwt-token').value;

            try {
                const response = await fetch('http://localhost:3000/documentation', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (!response.ok) {
                    throw new Error(`Erreur HTTP: ${response.status}`);
                }

                const data = await response.json();
                document.getElementById('documentation-content').innerHTML =
                    `<pre>${data.content}</pre>`;
            } catch (error) {
                document.getElementById('documentation-content').innerHTML =
                    `<p style="color: red">Erreur: ${error.message}</p>`;
            }
        }
    </script>
</body>

</html>
