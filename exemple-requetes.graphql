# Exemple de requête GraphQL pour récupérer un véhicule avec expertise
# NOTE: Pour les champs de type objet comme expertise, vous devez TOUJOURS spécifier les sous-champs!

# Requête correcte avec sélection de sous-champs pour expertise
query VehicleWithExpertiseCorrect {
  vehicle(id: "mc-automobiles-68587") {
    id
    brand
    model
    price
    expertise {
      # Vous devez toujours spécifier au moins un sous-champ
      date_expertise
      boite_motorisation
      pare_choc_av
    }
  }
}

# Requête incorrecte - va générer une erreur
query VehicleWithExpertiseIncorrect {
  vehicle(id: "mc-automobiles-68587") {
    id
    brand
    model
    price
    expertise   # ERREUR: Vous devez spécifier les sous-champs
  }
}

# Requête d'un véhicule avec tous les détails de l'expertise
query VehicleWithFullExpertise {
  vehicle(id: "mc-automobiles-68587") {
    id
    brand
    model
    version
    price
    totalPrice
    expertiseUrl
    
    # Expertise avec tous les champs possibles
    expertise {
      date_expertise
      boite_motorisation
      pare_brise
      pare_choc_av
      anti_brouillard
      feux_av
      calandre
      capot
      nbre_places
      vitres_electriques
      jantes_alu
      gps
      bluetooth
      radar_recul
      feux_automatique
      phares
      sellerie
      retros_rab_elec
      accoudoir
    }
  }
}

# Exemple pour une liste de véhicules avec expertise minimale
query VehiclesWithBasicExpertise {
  vehicles {
    id
    brand
    model
    price
    year
    expertise {
      jantes_alu
      bluetooth
      gps
    }
  }
}
